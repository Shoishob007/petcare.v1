services:
  - type: web
    name: petcare-hub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_SSL
        value: require
      - key: API_TITLE
        value: PetCare Hub API
      - key: API_VERSION
        value: 1.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: ALLOWED_EXTENSIONS
        value: jpg,jpeg,png,gif
      - key: CORS_ORIGINS
        sync: false
